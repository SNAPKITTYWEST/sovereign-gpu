[package]
name = "sovereign-gpu-simulator"
version = "0.1.0"
edition = "2021"
authors = ["Ahmad Ali Parr <ahmedparr93@gmail.com>"]
license = "BSL-1.1 OR AGPL-3.0 OR MIT"

[[bin]]
name = "simulator"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
